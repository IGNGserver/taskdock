name: quality

on:
  pull_request:
    paths: &quality_paths
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'infra/**'
      - 'compose*.yaml'
      - '.dockerignore'
      - '*.json'
      - '*.yaml'
      - '*.ts'
      - '*.mjs'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths: *quality_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: devtodo_test
          POSTGRES_USER: devtodo
          POSTGRES_PASSWORD: devtodo_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devtodo -d devtodo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: devtodo_mysql_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Block known high-severity dependency advisories
        run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org
      # `docker compose config` resolves interpolation and anchors, so a broken
      # anchor, a missing required variable or a YAML typo fails here instead of
      # at deploy time. It never pulls images.
      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail
          export APP_VERSION=validate APP_ORIGIN=http://localhost:3000
          export POSTGRES_PASSWORD=validate MYSQL_PASSWORD=validate MYSQL_ROOT_PASSWORD=validate
          export DATABASE_URL=postgres://validate:validate@127.0.0.1:5432/validate
          export BOOTSTRAP_TOKEN=validate-token-at-least-32-characters-long
          export ACCESS_TOKEN_SECRET=validate-secret-at-least-32-characters-long
          export REFRESH_TOKEN_PEPPER=validate-pepper-at-least-32-characters-long
          export CORS_ALLOWED_ORIGINS=http://localhost:3000
          export OWNER_USERNAME=validate OWNER_PASSWORD=validate-password
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.external-db.yaml config --quiet
          docker compose -f compose.mysql.yaml config --quiet
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm tokens:check
      - run: pnpm brand:sync
      - run: pnpm openapi:check
      - name: Parse browser regression suites before heavy checks
        run: pnpm exec playwright test --list
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
        env:
          TASKDOCK_TEST_DATABASE_URL: postgres://devtodo:devtodo_test_password@127.0.0.1:5432/devtodo_test
      - run: pnpm build
      - name: Verify precompressed static delivery
        run: pnpm exec tsx scripts/check-static-delivery.ts
      # MySQL is a first-class engine: dialect probes, the full integration
      # smoke and the HTTP runtime smoke all run against a real server.
      - name: MySQL dialect, integration and runtime gates
        shell: bash
        run: |
          set -euo pipefail
          TASKDOCK_MYSQL_TEST_URL=mysql://root:root_test_password@127.0.0.1:3306 \
            pnpm test:mysql-compat
          TASKDOCK_TEST_DATABASE_URL=mysql://root:root_test_password@127.0.0.1:3306/devtodo_mysql_test \
            pnpm test:integration
          # The runtime smoke needs a database with no Owner, so give it a
          # separate schema instead of relying on the cleanup above.
          node -e "const mysql=require('mysql2/promise');(async()=>{const c=await mysql.createConnection({host:'127.0.0.1',port:3306,user:'root',password:'root_test_password'});await c.query('CREATE DATABASE IF NOT EXISTS devtodo_mysql_runtime CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci');await c.end();})()"
          TASKDOCK_TEST_DATABASE_URL=mysql://root:root_test_password@127.0.0.1:3306/devtodo_mysql_runtime \
            pnpm test:mysql-runtime
      - name: PostgreSQL restart and mobile loading benchmark
        shell: bash
        run: |
          set -euo pipefail
          PG_BIN="$(pg_config --bindir)"
          export PG_CTL="$PG_BIN/pg_ctl"
          export PGDATA="$RUNNER_TEMP/taskdock-runtime-pg/data"
          mkdir -p "$(dirname "$PGDATA")"
          "$PG_BIN/initdb" -D "$PGDATA" -A trust -U devtodo
          trap '"$PG_CTL" -D "$PGDATA" -m fast stop || true' EXIT
          "$PG_CTL" -D "$PGDATA" -l "$(dirname "$PGDATA")/postgres.log" -o "-p 55439 -h 127.0.0.1 -k $(dirname "$PGDATA")" start
          "$PG_BIN/createdb" -h 127.0.0.1 -p 55439 -U devtodo devtodo_runtime
          DATABASE_URL=postgres://devtodo@127.0.0.1:55439/devtodo_runtime pnpm db:migrate
          TASKDOCK_TEST_DATABASE_URL=postgres://devtodo@127.0.0.1:55439/devtodo_runtime pnpm test:pg-runtime
          "$PG_BIN/createdb" -h 127.0.0.1 -p 55439 -U devtodo devtodo_benchmark
          TASKDOCK_TEST_DATABASE_URL=postgres://devtodo@127.0.0.1:55439/devtodo_benchmark pnpm exec tsx scripts/sync-bootstrap-benchmark.ts | tee mobile-loading-benchmark.json
      - name: Prepare Ubuntu package downloads for browser tests
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          mirror = re.compile(r'(?<!\S)https?://azure\.archive\.ubuntu\.com/ubuntu(/?)(?!\S)')
          for path in paths:
              if not path.is_file():
                  continue
              source = path.read_text()
              updated_lines = []
              for line in source.splitlines(keepends=True):
                  comment = re.search(r'(?<!\S)#', line)
                  end = comment.start() if comment else len(line)
                  active = mirror.sub(r'https://archive.ubuntu.com/ubuntu\1', line[:end])
                  updated_lines.append(active + line[end:])
              updated = ''.join(updated_lines)
              if source != updated:
                  path.write_text(updated)
                  print(f'Updated Ubuntu package mirror URI in {path}')
          Path('/etc/apt/apt.conf.d/80-ci-downloads').write_text('Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n')
          PY
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        timeout-minutes: 10
      - name: Create an isolated browser PostgreSQL fixture
        run: PGPASSWORD=devtodo_test_password psql -h 127.0.0.1 -U devtodo -d postgres -c 'CREATE DATABASE devtodo_e2e'
      - run: pnpm test:e2e
      # 真实链路门禁必须跑生产构建：e2e-real-server.ts 只在 E2E_PWA=1 时用 vite preview
      # 提供 dist 与 service worker，否则退化成 vite dev，mobile-pwa / real-smoke 这类
      # 依赖已构建产物与 IndexedDB 真实链路的用例永远不可能通过。
      - run: E2E_PWA=1 E2E_REAL=1 pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgres://devtodo:devtodo_test_password@127.0.0.1:5432/devtodo_e2e
      - run: pnpm compose:smoke
      # 失败时保留 Playwright 的 error-context.md（页面可访问性快照）、trace 与报告：
      # 真实链路门禁只在 CI 存在，没有这些工件就只能靠断言文本猜因。放在最后一步，
      # 因此前面任一步骤失败都能拿到现场。
      - name: 上传 E2E 失败工件
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
