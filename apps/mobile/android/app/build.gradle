apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.google.devtools.ksp'

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('signing/taskdock-release.properties')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def signingValue = { String propertyName, String environmentName ->
    releaseSigningProperties.getProperty(propertyName) ?: System.getenv(environmentName)
}
def releaseStoreFile = signingValue('storeFile', 'TASKDOCK_ANDROID_KEYSTORE_PATH')
def releaseStoreType = signingValue('storeType', 'TASKDOCK_ANDROID_KEYSTORE_TYPE') ?: 'PKCS12'
def releaseStorePassword = signingValue('storePassword', 'TASKDOCK_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'TASKDOCK_ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'TASKDOCK_ANDROID_KEY_PASSWORD')
def releaseSigningAvailable = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseTaskRequested && !releaseSigningAvailable) {
    throw new GradleException('缺少 Android Release 签名配置。请准备 signing/taskdock-release.properties 或 TASKDOCK_ANDROID_* 环境变量。')
}
def taskdockVersion = System.getenv("TASKDOCK_VERSION") ?: "0.1.0"
def taskdockBaseVersion = taskdockVersion.replaceFirst(/-.*/, '')
def taskdockVersionParts = taskdockBaseVersion.tokenize('.').collect { it as Integer }
def taskdockVersionCode = taskdockVersionParts[0] * 1_000_000 +
        taskdockVersionParts[1] * 1_000 +
        taskdockVersionParts[2]

android {
    namespace = "com.devtodo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.devtodo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode taskdockVersionCode
        versionName taskdockVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile rootProject.file(releaseStoreFile)
                storeType releaseStoreType
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    lint {
        checkReleaseBuilds = true
        abortOnError = true
    }
    buildFeatures {
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    // AndroidX & Lifecycle
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Compose BOM & Material 3
    def composeBom = platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "androidx.navigation:navigation-compose:$navigationComposeVersion"
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Coroutines & Serialization
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationVersion"

    // Networking (OkHttp) & WebSocket
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttpVersion"

    // Room Database
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Secure Storage
    implementation "androidx.security:security-crypto:$securityCryptoVersion"

    // Testing
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
