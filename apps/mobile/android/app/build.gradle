apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.google.devtools.ksp'

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('signing/taskdock-release.properties')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def signingValue = { String propertyName, String environmentName ->
    releaseSigningProperties.getProperty(propertyName) ?: System.getenv(environmentName)
}
def releaseStoreFile = signingValue('storeFile', 'TASKDOCK_ANDROID_KEYSTORE_PATH')
def releaseStoreType = signingValue('storeType', 'TASKDOCK_ANDROID_KEYSTORE_TYPE') ?: 'PKCS12'
def releaseStorePassword = signingValue('storePassword', 'TASKDOCK_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'TASKDOCK_ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'TASKDOCK_ANDROID_KEY_PASSWORD')
def releaseSigningAvailable = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseTaskRequested && !releaseSigningAvailable) {
    throw new GradleException('缺少 Android Release 签名配置。请准备 signing/taskdock-release.properties 或 TASKDOCK_ANDROID_* 环境变量。')
}
def taskdockVersion = System.getenv("TASKDOCK_VERSION") ?: "0.1.0"
def taskdockVersionMatch = (taskdockVersion =~ /^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$/)
if (!taskdockVersionMatch.matches()) {
    throw new GradleException("TASKDOCK_VERSION 必须是 major.minor.patch 或 major.minor.patch-(alpha|beta|rc).N，实际: ${taskdockVersion}")
}
def taskdockMajor = taskdockVersionMatch.group(1).toInteger()
def taskdockMinor = taskdockVersionMatch.group(2).toInteger()
def taskdockPatch = taskdockVersionMatch.group(3).toInteger()
// Stable releases sort above every prerelease of the same base version.
def taskdockPrereleaseText = taskdockVersionMatch.group(5)
def taskdockPrerelease = taskdockPrereleaseText?.toInteger() ?: 999
if (taskdockPrereleaseText != null && taskdockPrerelease > 998) {
    throw new GradleException("预发布序号必须在 0..998 之间")
}
// Android's versionCode cannot contain dots. Keep each release strictly
// increasing so rc.53 -> rc.54 is accepted by the package installer.
def taskdockVersionCode = taskdockMajor * 100_000_000 +
        taskdockMinor * 1_000_000 +
        taskdockPatch * 1_000 +
        taskdockPrerelease
if (taskdockVersionCode > 2_100_000_000) {
    throw new GradleException("versionCode 超出 Android 上限: ${taskdockVersionCode}")
}
println "TaskDock ${taskdockVersion} -> versionCode ${taskdockVersionCode}"

android {
    namespace = "com.devtodo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.devtodo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode taskdockVersionCode
        versionName taskdockVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile rootProject.file(releaseStoreFile)
                storeType releaseStoreType
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    lint {
        checkReleaseBuilds = true
        abortOnError = true
    }
    // Room exports its schema JSON into `schemas/`. Migration tests read those
    // files through the instrumentation assets, so they must be packaged for
    // androidTest or `MigrationTestHelper` cannot open an old database version.
    sourceSets {
        androidTest {
            assets.srcDirs += files("$projectDir/schemas")
        }
    }
    buildFeatures {
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.incremental", "true")
    arg("room.generateKotlin", "true")
}

dependencies {
    // AndroidX & Lifecycle
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Compose BOM & Material 3
    def composeBom = platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.compose.material3:material3:$material3Version"
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "androidx.navigation:navigation-compose:$navigationComposeVersion"
    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation "androidx.glance:glance-material3:$glanceVersion"
    implementation "androidx.work:work-runtime-ktx:$workVersion"
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Coroutines & Serialization
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationVersion"

    // Networking (OkHttp) & WebSocket
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttpVersion"

    // Room Database
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Secure Storage
    implementation "androidx.security:security-crypto:$securityCryptoVersion"

    // Testing
    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
