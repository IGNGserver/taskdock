<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2f9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="TaskDock：为个人开发工作设计的离线优先任务工作台" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TaskDock" />
    <!-- Safari 26+ uses the site icon for Home Screen web apps as well as tabs.
         Keep a high-resolution source in the rel=icon set so it never has to
         upscale the 64px favicon. -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link
      rel="icon"
      href="/icons/%TASKDOCK_ICON_REVISION%/pwa-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link
      rel="icon"
      href="/icons/%TASKDOCK_ICON_REVISION%/pwa-512.png"
      type="image/png"
      sizes="512x512"
    />
    <!-- iOS caches an installed web clip's icon permanently against these URLs.
         The /icons/ paths are the refreshed set; /apple-touch-icon.png at the
         repository root remains for Safari's automatic fallback probe. -->
    <link
      rel="apple-touch-icon"
      href="/icons/%TASKDOCK_ICON_REVISION%/apple-touch-icon-180x180.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/%TASKDOCK_ICON_REVISION%/apple-touch-icon-180x180.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="/icons/%TASKDOCK_ICON_REVISION%/apple-touch-icon-167x167.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/%TASKDOCK_ICON_REVISION%/apple-touch-icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/icons/%TASKDOCK_ICON_REVISION%/apple-touch-icon-120x120.png"
    />
    <link
      rel="icon"
      href="/icons/%TASKDOCK_ICON_REVISION%/pwa-1024.png"
      type="image/png"
      sizes="1024x1024"
    />
    <title>TaskDock · 开发任务工作台</title>
    <script src="/theme-preload.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
