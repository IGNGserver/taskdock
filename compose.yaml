x-taskdock-image: &taskdock_image '${TASKDOCK_IMAGE:-ghcr.io/igngserver/taskdock}:${APP_VERSION:?set APP_VERSION to an immutable image tag}'
x-app-security: &app_security
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devtodo}
      POSTGRES_USER: ${POSTGRES_USER:-devtodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password in .env}
    volumes:
      - devtodo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [devtodo]

  redis:
    profiles: [cache]
    image: redis:7.4-alpine
    restart: unless-stopped
    # Cache-only: no AOF/RDB, because entities and sync cursors live in PostgreSQL.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [devtodo]

  migrate:
    <<: *app_security
    image: *taskdock_image
    restart: 'no'
    environment: &app-env
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:?set APP_VERSION to an immutable image tag}
      APP_PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?set the public HTTP or HTTPS origin in .env}
      # Discrete PG* values avoid breaking the URL when the password contains
      # @, :, / or #. External deployments use DATABASE_URL instead.
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-devtodo}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-devtodo}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_WARM: ${DB_POOL_WARM:-0}
      DB_APPLICATION_NAME: ${DB_APPLICATION_NAME:-taskdock-api}
      DB_LISTEN_ENABLED: ${DB_LISTEN_ENABLED:-true}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-300000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-30000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_STARTUP_MAX_WAIT_MS: ${DB_STARTUP_MAX_WAIT_MS:-60000}
      MIGRATION_STATEMENT_TIMEOUT_MS: ${MIGRATION_STATEMENT_TIMEOUT_MS:-300000}
      CACHE_URL: ${CACHE_URL:-}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-taskdock}
      CACHE_SNAPSHOT_TTL_SECONDS: ${CACHE_SNAPSHOT_TTL_SECONDS:-60}
      CACHE_REQUIRED: ${CACHE_REQUIRED:-false}
      AUTH_RATE_LIMIT_REQUIRE_SHARED: ${AUTH_RATE_LIMIT_REQUIRE_SHARED:-true}
      CACHE_TLS_CA: ${CACHE_TLS_CA:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?set a random bootstrap token in .env}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set an access token secret in .env}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?set a refresh token pepper in .env}
      REFRESH_TOKEN_IDLE_TTL_DAYS: ${REFRESH_TOKEN_IDLE_TTL_DAYS:-365}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set explicit allowed origins in .env}
      NATIVE_ALLOWED_ORIGINS: ${NATIVE_ALLOWED_ORIGINS:-capacitor://localhost,https://localhost,http://localhost}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      DEV_MEMORY_STORE: 'false'
    command: ['node', 'apps/api/dist/migrate.js']
    depends_on:
      postgres: { condition: service_healthy }
    networks: [devtodo]

  bootstrap:
    <<: *app_security
    image: *taskdock_image
    profiles: [operations]
    environment:
      <<: *app-env
      OWNER_USERNAME: ${OWNER_USERNAME:?set the initial owner username in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set the initial owner password in .env}
    command: ['node', 'apps/api/dist/bootstrap-owner.js']
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [devtodo]

  app:
    <<: *app_security
    image: *taskdock_image
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - '${TASKDOCK_BIND_ADDRESS:-127.0.0.1}:${TASKDOCK_PORT:-48731}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [devtodo]

  gateway:
    profiles: [gateway]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?set the public HTTP or HTTPS origin in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [devtodo]

volumes:
  devtodo_pgdata:
  caddy_data:
  caddy_config:

networks:
  devtodo:
    driver: bridge
